; Kumaşgöz Phase 1 — process supervision template
; Install: sudo apt install supervisor
; Enable: sudo ln -s $(pwd)/deploy/supervisord.conf /etc/supervisor/conf.d/kumasgoz.conf
; Or run user-level: supervisord -c deploy/supervisord.conf

[unix_http_server]
file=/tmp/kumasgoz-supervisor.sock

[supervisord]
logfile=/tmp/kumasgoz-supervisord.log
pidfile=/tmp/kumasgoz-supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/kumasgoz-supervisor.sock

[program:kumasgoz-watchdog]
command=/home/yasin-yagmur01/miniconda3/envs/kumasgoz/bin/python -m kumasgoz.watchdog_service --db /home/yasin-yagmur01/kumasgoz/data/kumasgoz.db --interval 5
directory=/home/yasin-yagmur01/kumasgoz
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=5
stdout_logfile=/tmp/kumasgoz-watchdog.log
stderr_logfile=/tmp/kumasgoz-watchdog.err

[program:kumasgoz-dashboard]
command=/home/yasin-yagmur01/miniconda3/envs/kumasgoz/bin/python /home/yasin-yagmur01/kumasgoz/scripts/09_run_dashboard.py --db /home/yasin-yagmur01/kumasgoz/data/kumasgoz.db --host 127.0.0.1 --port 8080
directory=/home/yasin-yagmur01/kumasgoz
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/tmp/kumasgoz-dashboard.log
stderr_logfile=/tmp/kumasgoz-dashboard.err

; Live loop: default score-bank folder replay (one-shot).
; For online GPU: add --mode online. For webcam: --capture webcam --webcam 0 --limit 0 + autorestart=true.
[program:kumasgoz-live-loop]
command=/home/yasin-yagmur01/miniconda3/envs/kumasgoz/bin/python /home/yasin-yagmur01/kumasgoz/scripts/10_live_loop.py --config /home/yasin-yagmur01/kumasgoz/configs/live_loop.yaml
directory=/home/yasin-yagmur01/kumasgoz
autostart=false
autorestart=false
startsecs=1
stdout_logfile=/tmp/kumasgoz-live-loop.log
stderr_logfile=/tmp/kumasgoz-live-loop.err
