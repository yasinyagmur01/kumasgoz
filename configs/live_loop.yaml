# Live loop — capture → blur → scores → actuation → SQLite
db_path: data/kumasgoz.db
profiles_dir: profiles
profile_id: carpet_patchcore_v1

# score_bank = precomputed predictions.json (fast replay)
# online     = load checkpoints and score each frame on GPU
mode: score_bank

# Capture stub: folder | video | webcam
capture:
  type: folder
  path: data/mvtec/carpet/test
  device_index: 0      # webcam index when type=webcam
  max_frames: 0        # 0 = unlimited (webcam/video)

# Backward-compat alias used when capture.path unset
image_dir: data/mvtec/carpet/test
limit: 0  # 0 = all

blur:
  threshold: 50.0
  skip_blurry: true

vote: and

# Per-member prediction dumps (path-aligned scores) — score_bank mode
members:
  patchcore: results/carpet_patchcore/latest/predictions.json
  padim: results/carpet_padim/latest/predictions.json

# Online GPU members — used when mode: online
online:
  device: null  # null = auto (cuda if available)
  image_size: 256
  members:
    patchcore:
      model: Patchcore
      checkpoint: results/carpet_patchcore/latest
      backbone: wide_resnet50_2
      layers: [layer2, layer3]
      coreset_sampling_ratio: 0.1
      num_neighbors: 9
    padim:
      model: Padim
      checkpoint: results/carpet_padim/latest
      backbone: resnet18
      layers: [layer1, layer2, layer3]
      n_features: 100

# Thresholds: prefer adaptive files; fallback 0.5
thresholds:
  patchcore: results/carpet_patchcore/latest/adaptive_threshold.json
  padim: results/carpet_padim/latest/adaptive_threshold.json

actuation:
  stop_confirm_frames: 2
  resume_confirm_frames: 3
  latch_on_stop: true
  watchdog_timeout_s: 0

results_dir: results/live_loop
