# Phase 1 MVP + polish paths
db_path: data/kumasgoz.db
profiles_dir: profiles

blur:
  threshold: 100.0

calibration:
  max_fpr: 0.05
  method: normal_percentile

dashboard:
  host: 127.0.0.1
  port: 8080
  # Live tail via SSE: GET /api/events/stream

watchdog:
  interval_s: 5

live_loop:
  default_mode: score_bank  # or online
  capture: folder           # folder | video | webcam
